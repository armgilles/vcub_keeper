[get_prediction_station_prompt]
prompt_description = """
Il est formellement interdit de deviner la valeur retournée par cet outil ou de simuler sa sortie.
Toute prédiction doit passer par son appel effectif. Si cet outil n’a pas été exécuté, tu ne peux pas répondre !

Permet de faire une prédiction sur une station donnée à partir des données historiques disponibles.
Réflexion :
1. Trouver l'ID de la station à partir du nom de la station dans le DataFrame last_info_station.
2. Calculer l'horizon de prédiction.
3. Utiliser la fonction get_prediction_station pour faire la prédiction.

Paramètres requis :
- 'target_station_id': ID de la station à prédire.
- 'target_col': Colonne cible à prédire, par exemple 'available_bike_stands' ou 'available_bikes' UNIQUEMENT.
- 'horizon_prediction': Horizon de prédiction par période de 10 minutes, par exemple '20m', '2h', '4h', '1d', etc.

Calcul de l'horizon de prédiction :
- Utilisez la date actuelle (présente dans last_info_station).
- Interprétez la demande de l'utilisateur pour en déduire l'horizon de prédiction -> date désirée par l'utilisateur - date actuelle !
IMPORTANT : NE PAS UTILISER python_repl_ast pour calculer l'horizon de prédiction !
- Ne faites pas de prédiction sur une période supérieure à 24 heures. Si la période dépasse 24 heures, indiquez à l'utilisateur que ce n'est pas possible.

Exemple d'utilisation :
L'utilisateur souhaite prédire le nombre de vélos disponibles à la station Berges du Lac dans 2 heures.
1. Trouvez l'ID de la station Berges du Lac dans le DataFrame last_info_station.
2. Utilisez la date actuelle pour calculer l'horizon de prédiction.
3. Exécutez la fonction get_prediction_station avec en paramètres une chaine de caractères contenant :
   - target_station_id=175
   - target_col=available_bike_stands
   - horizon_prediction=2h
4. La fonction renvoie la prédiction.

Exemple de code pour la station 175 sur la prédiction de place disponible dans 2 heures :
"target_station_id=175,target_col=available_bike_stands,horizon_prediction=2h"
prediction = get_prediction_station("target_station_id=175,target_col=available_bike_stands,horizon_prediction=2h")
"""


[retriever_tool_prompt]
prompt_description = """
Permets de pouvoir intéroger une base de connaissance (base vectorielle) pour récupérer des documents pertinents
en ceux qui concerne 2 points particuliers:
1. Répondre a des interrogations sur le projet en lui même.
2. Répondre a des interrogations sur l'utilisation des Vcub, leurs prix etc...

Tu peux faire un résumé de la réponse en te basant sur les documents pertinents qui te sont retournés
en étant le plus concis possible. Si tu as des doutes sur la pertinence de l'information, ne l'utilise pas.

Si tu as besoin de plus d'informations, tu peux poser des questions complémentaires
pour affiner ta recherche.
"""