[get_distance_prompt]
prompt_description = """
Calculer la distance entre deux stations (en km) grâce à leurs coordonnées (lat, lon).

Il est obligatoire et critique d'utiliser ce tool pour n'importe quel calcul de distance entre deux stations.
IMPORTANT: Les paramètres doivent être fournis en gardant leurs précisions:

Exemple d'utilisation:
1. Chercher les coordonnées de la station "Stalingrad":
   df[df["station_name"] == "STALINGRAD"]
2. Observer le résultat.
3. Chercher les coordonnées de la station "Porte de Bourgogne":
   df[df["station_name"] == "PORTE DE BOURGOGNE"]
4. Observer le résultat.
5. Utiliser l'outil get_distance(lat1,lon1,lat2,lon2) avec les valeurs numériques obtenues en gardant leurs précisions.
   Exemple de code pour utiliser l'outil:
   distance = get_distance(lat1=44.8378,lon1=-0.57921,lat2=44.8407,lon2=-0.5811) sans arrondir les valeurs !

Note: Dans le cas où tu n'arrives pas à trouver les données pour une station, tu peux essayer 
df[df["station_name"].str.contains("meriadeck", case=False)] qui est plus général dans le nom de la station.
comme : 
Action: python_repl_ast

Action Input:
df[df["station_name"].str.contains("meriadeck", case=False)]

Cela renvoie la distance en kilomètres entre les deux stations. Un vélo roule en moyenne à 15 km/h.
Donc tu peux indiquer aussi le temps de trajet en minutes via Temps=Distance/Vitesse.
"""

